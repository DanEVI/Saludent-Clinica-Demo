<section class="casos" id="casos">
  <div class="container">
    <app-encabezado-seccion
      icono="bi-images"
      etiqueta="Galería de casos"
      titulo="Resultados reales de nuestros pacientes"
      descripcion="Compara el antes y el después de algunos tratamientos realizados en Saludent."
    />

    <div id="carruselCasos" class="carousel slide" data-bs-ride="carousel">
      <div class="carousel-inner">
        @for (caso of casos; track caso.tratamiento) {
          <div class="carousel-item" [class.active]="$first">
            <app-tarjeta [relleno]="false">
              <div class="row g-0">
                <div class="col-6">
                  <div class="foto">
                    <img [src]="caso.antes" [alt]="caso.tratamiento + ' antes'" />
                    <span class="badge-foto">Antes</span>
                  </div>
                </div>
                <div class="col-6">
                  <div class="foto">
                    <img [src]="caso.despues" [alt]="caso.tratamiento + ' después'" />
                    <span class="badge-foto badge-despues">Después</span>
                  </div>
                </div>
              </div>
              <div
                class="datos d-flex flex-column flex-md-row justify-content-between align-items-md-center"
              >
                <div>
                  <h3 class="nombre">{{ caso.tratamiento }}</h3>
                  <p class="texto">{{ caso.descripcion }}</p>
                </div>
                <span class="duracion mt-2 mt-md-0">
                  <i class="bi bi-clock me-1"></i> {{ caso.duracion }}
                </span>
              </div>
            </app-tarjeta>
          </div>
        }
      </div>

      <button
        class="carousel-control-prev"
        type="button"
        data-bs-target="#carruselCasos"
        data-bs-slide="prev"
      >
        <span class="flecha"><i class="bi bi-chevron-left"></i></span>
        <span class="visually-hidden">Anterior</span>
      </button>
      <button
        class="carousel-control-next"
        type="button"
        data-bs-target="#carruselCasos"
        data-bs-slide="next"
      >
        <span class="flecha"><i class="bi bi-chevron-right"></i></span>
        <span class="visually-hidden">Siguiente</span>
      </button>
    </div>

    <div class="d-flex justify-content-center flex-wrap gap-2 mt-4">
      @for (caso of casos; track caso.tratamiento; let i = $index) {
        <button
          type="button"
          class="btn btn-contorno btn-caso rounded-pill"
          data-bs-target="#carruselCasos"
          [attr.data-bs-slide-to]="i"
        >
          {{ caso.tratamiento }}
        </button>
      }
    </div>
  </div>
</section>
