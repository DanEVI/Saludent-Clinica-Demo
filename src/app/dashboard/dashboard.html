<section class="dashboard">
  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <span class="saludo">
        <i class="bi bi-person-circle me-1"></i> Hola, {{ auth.usuario()?.nombre }}
      </span>
      <button type="button" class="btn btn-contorno rounded-pill" (click)="salir()">
        <i class="bi bi-box-arrow-right me-1"></i> Cerrar sesión
      </button>
    </div>

    <app-encabezado-seccion
      [nivel]="1"
      icono="bi-speedometer2"
      etiqueta="Dashboard"
      titulo="Gestión de leads y citas"
      descripcion="Esta sección está en construcción. Aquí podrás ver los leads que llegan desde el formulario de citas."
    />
  </div>
</section>
