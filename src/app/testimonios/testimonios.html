<section class="testimonios" id="testimonios">
  <div class="container">
    <app-encabezado-seccion
      icono="bi-chat-heart"
      etiqueta="Testimonios"
      titulo="Lo que dicen nuestros pacientes"
      descripcion="Opiniones de personas que confiaron su sonrisa a nuestro equipo."
    />

    <div class="row g-4">
      @for (testimonio of testimonios; track testimonio.nombre) {
        <div class="col-12 col-md-4">
          <app-tarjeta>
            <div class="d-flex align-items-center mb-3">
              <img class="avatar me-3" [src]="testimonio.foto" [alt]="testimonio.nombre" />
              <div>
                <p class="nombre mb-0">{{ testimonio.nombre }}</p>
                <app-calificacion [puntaje]="testimonio.puntaje" />
              </div>
            </div>
            <p class="comentario mb-0">"{{ testimonio.comentario }}"</p>
          </app-tarjeta>
        </div>
      }
    </div>
  </div>
</section>
