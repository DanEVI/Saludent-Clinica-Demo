<section class="servicios">
  <div class="container">
    <app-encabezado-seccion
      [nivel]="1"
      icono="bi-clipboard2-pulse"
      etiqueta="Servicios dentales"
      titulo="Todo lo que tu sonrisa necesita en un solo lugar"
      descripcion="Desde una limpieza hasta un implante, nuestros especialistas te acompañan en cada paso del tratamiento."
    />

    <div class="row g-4">
      @for (servicio of servicios; track servicio.nombre) {
        <div class="col-12 col-sm-6 col-lg-3">
          <app-tarjeta [elevable]="true">
            <span class="icono mb-3">
              <i class="bi {{ servicio.icono }}"></i>
            </span>
            <h2 class="nombre">{{ servicio.nombre }}</h2>
            <p class="texto">{{ servicio.descripcion }}</p>
            <app-boton-agendar variante="enlace" [servicio]="servicio.nombre">
              Agendar <i class="bi bi-arrow-right ms-1"></i>
            </app-boton-agendar>
          </app-tarjeta>
        </div>
      }
    </div>

    <div class="text-center mt-5">
      <a class="btn btn-contorno btn-grande rounded-pill" routerLink="/precios">
        <i class="bi bi-cash-coin me-2"></i> Ver precios de tratamientos
      </a>
    </div>
  </div>
</section>
