<section class="equipo">
  <div class="container">
    <app-encabezado-seccion
      [nivel]="1"
      icono="bi-people-fill"
      etiqueta="Equipo profesional"
      titulo="Especialistas con nombre, apellido y registro"
      descripcion="Todos nuestros odontólogos están habilitados por el Colegio Odontológico del Perú y se capacitan cada año."
    />

    <div class="row g-4">
      @for (doctor of doctores; track doctor.nombre) {
        <div class="col-12 col-sm-6 col-lg-3">
          <app-tarjeta [relleno]="false" [elevable]="true">
            <div class="foto">
              <img [src]="doctor.foto" [alt]="doctor.nombre" />
              <span class="badge-anios">
                <i class="bi bi-award-fill me-1"></i> {{ doctor.anios }} años
              </span>
            </div>
            <div class="datos">
              <h2 class="nombre">{{ doctor.nombre }}</h2>
              <p class="especialidad">{{ doctor.especialidad }}</p>
              <p class="registro">{{ doctor.registro }}</p>
            </div>
          </app-tarjeta>
        </div>
      }
    </div>
  </div>
</section>
